<!DOCTYPE html>
<html lang="ja">
<head>

      <div class="profile-content">

        <p class="intro">
          はじめまして、とまとぅー🍅です。とまとぅー王国の王様を名乗っていますが、全然偉くないので気軽に話しかけてください。普段はNFTの世界で作品を見たり、コミュニティで交流したりして遊んでいるだけです。ゲームを楽しんだり、ゆっくり酒を飲んだりしながら、自分らしいペースで毎日を過ごしています。楽しいことを一緒に見つけられたらうれしいです。
        </p>

        <section class="hobby-section" aria-labelledby="hobby-title">
